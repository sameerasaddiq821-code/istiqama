<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.2" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.4" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Squircle Base -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Decorative Ring -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="8" stroke-dasharray="12 12" />
  
  <!-- Glowing Center Container -->
  <circle cx="256" cy="256" r="150" fill="url(#glowGrad)" filter="url(#shadow)" />
  
  <!-- Islamic Crescent Motif Combined with Habit Check / Streak Flame -->
  <path d="M 290 140 A 110 110 0 1 0 350 290 A 85 85 0 0 1 290 140 Z" fill="#ffffff" opacity="0.9" />
  
  <!-- Star / Sparkle of Consistency -->
  <polygon points="320,160 326,178 345,180 330,192 334,210 320,198 306,210 310,192 295,180 314,178" fill="#fef08a" />
  
  <!-- Dynamic Bold Checkmark for Habit Completion -->
  <path d="M 190 265 L 235 310 L 330 205" fill="none" stroke="#ffffff" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />
</svg>
